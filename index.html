<title>EXAMW9 - Ponpes Walisongo</title>
<style>
:root{--g:#16803c;--gd:#0f5f2c;--gl:#e9f6ee;--gold:#d4a017;--bd:#e3e9e5;--tx:#1b2a21;--mu:#66746b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#fff;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
button{cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;width:100%;padding:11px 13px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;margin:5px 0 12px;transition:.15s;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px #16803c22}
input[readonly]{background:#f6f8f7}
label{font-size:13px;font-weight:600;color:#33473a}
.btn{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:600;box-shadow:0 3px 10px #16803c44;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.o{background:#fff;color:var(--g);border:1.5px solid var(--g);box-shadow:none}
.btn.r{background:#c0392b;box-shadow:none}.btn.s{padding:5px 11px;font-size:13px}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px;box-shadow:0 6px 24px rgba(20,60,35,.07);animation:up .35s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 40px}
.center{text-align:center}.err{color:#c0392b;font-size:13px;min-height:20px}
/* banner jaringan */
#nb{position:fixed;top:0;left:50%;transform:translate(-50%,-120%);z-index:99;padding:8px 18px;border-radius:0 0 12px 12px;font-size:13px;font-weight:600;color:#fff;transition:.3s;max-width:95%;text-align:center}
#nb.show{transform:translate(-50%,0)}#nb.off{background:#c0392b}#nb.slow{background:#e67e22}#nb.ok{background:var(--g)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:30px;z-index:99;font-size:14px;animation:up .3s}
/* login */
.lg{min-height:100vh;background:linear-gradient(#16803c 50%,#fff 50%);position:relative;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.lg:before{content:"";position:absolute;inset:0 0 50% 0;background:radial-gradient(circle at 15% 30%,#ffffff18 0 90px,transparent 91px),radial-gradient(circle at 85% 70%,#ffffff14 0 140px,transparent 141px),radial-gradient(circle at 60% 10%,#ffffff10 0 60px,transparent 61px)}
.lg .card{width:100%;max-width:410px;text-align:center;position:relative;padding:30px 26px}
.lg .logo{width:96px;height:96px;object-fit:contain;margin-top:-72px;background:#fff;border-radius:50%;padding:6px;box-shadow:0 6px 20px #0003}
.lg h1{margin:10px 0 2px;color:var(--g);font-size:27px}.lg p{margin:0 0 18px;color:var(--mu);font-size:14px}
.lg label{display:block;text-align:left}.pw{position:relative}.pw span{position:absolute;right:12px;top:15px;cursor:pointer;font-size:16px;user-select:none}
/* bar atas */
.top{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
.top .br{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}.top img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
.top .br span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{background:#fff;color:var(--g);border-radius:20px;padding:5px 15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.low{background:#c0392b;color:#fff;animation:bl 1s infinite}@keyframes bl{50%{opacity:.6}}
.pg{height:5px;background:#dcebe1}.pg i{display:block;height:100%;background:var(--gold);transition:.3s}
/* ujian */
.paper{position:relative;overflow:hidden;min-height:400px}
.wm{position:absolute;inset:0;background-position:center;background-repeat:no-repeat;background-size:50%;opacity:.08;pointer-events:none}
.paper>*:not(.wm){position:relative}
.chip{display:inline-block;background:var(--gl);color:var(--g);border-radius:20px;padding:3px 12px;font-size:12.5px;font-weight:700}
.bac{background:#f4faf6;border-left:4px solid var(--g);padding:13px 15px;border-radius:8px;margin:12px 0;white-space:pre-wrap}
.img{max-width:100%;max-height:320px;display:block;margin:10px 0;border-radius:8px;background:#f1f1f1}
.op{display:flex;gap:12px;align-items:center;border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer;background:#ffffffcc;transition:.15s}
.op:hover{border-color:var(--g)}.op.s{border-color:var(--g);background:var(--gl)}
.op b{display:grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:#eef2ef;color:var(--g)}.op.s b{background:var(--g);color:#fff}
.nav{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}
.nav button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--bd);background:#fff;font-weight:600}
.nav .d{background:var(--g);color:#fff;border-color:var(--g)}.nav .c{outline:3px solid var(--gold);outline-offset:1px}
.bot{position:sticky;bottom:0;background:#fffe;backdrop-filter:blur(6px);padding:12px 0;display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--bd)}
.rule li{margin:8px 0}
/* admin */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:6px 0 10px}
.tabs button{border:1.5px solid var(--bd);background:#fff;color:var(--tx);border-radius:30px;padding:8px 16px;font-weight:600;white-space:nowrap}
.tabs button.a{background:var(--g);color:#fff;border-color:var(--g)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.st div{background:var(--gl);border-radius:14px;padding:14px;text-align:center}.st b{display:block;font-size:26px;color:var(--g)}.st small{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--g);color:#fff;text-align:left;position:sticky;top:0}th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:top}tr:hover td{background:#f8fbf9}
.sc{overflow-x:auto;max-height:60vh}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:18px}}
.nl{display:inline-block;min-width:38px;text-align:center;border-radius:20px;padding:2px 10px;font-weight:800;background:var(--gl);color:var(--g)}.nl.k{background:#fdeaea;color:#c0392b}
/* sertifikat */
.cert{position:relative;border:10px double var(--g);outline:2px solid var(--gold);outline-offset:-18px;padding:34px 30px;text-align:center;background:#fff;margin-top:14px}
.cert .kop{display:flex;align-items:center;gap:14px;border-bottom:4px double var(--g);padding-bottom:12px;text-align:left;position:relative}
.cert .kop img{width:84px;height:84px;object-fit:contain}.cert h2{margin:0;font-size:20px;color:var(--g)}.cert small{color:var(--mu)}
.cert h1{letter-spacing:6px;margin:24px 0 6px;color:var(--gd)}
.cert .nm{font-size:30px;font-weight:700;border-bottom:2px solid var(--gold);display:inline-block;padding:0 28px;margin:8px 0;font-family:Georgia,serif}
.cert table{max-width:430px;margin:14px auto}.cert th,.cert td{text-align:center}
/* loading */
#ld{position:fixed;inset:0;z-index:150;background:#fff;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
#ld.on{opacity:1;pointer-events:all}.lw{text-align:center;padding:20px}
.rg{width:134px;height:134px;margin:0 auto 24px;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(var(--g),var(--gold),#fff 70%,var(--g));animation:sp 1.4s linear infinite}
.rg:before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}
.rg img{width:92px;height:92px;object-fit:contain;position:relative;animation:sp 1.4s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.lt{font-weight:700;color:var(--g);font-size:17px}.dt i{font-style:normal;animation:db 1.2s infinite}.dt i:nth-child(2){animation-delay:.2s}.dt i:nth-child(3){animation-delay:.4s}
@keyframes db{0%,60%,100%{opacity:.2}30%{opacity:1}}
.lb{width:210px;height:5px;background:var(--gl);border-radius:5px;margin:16px auto 10px;overflow:hidden}
.lb i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--g),var(--gold));border-radius:5px;animation:ib 1.2s ease-in-out infinite}
@keyframes ib{0%{margin-left:-40%}100%{margin-left:100%}}#ld small{color:var(--mu)}
/* anticheat */
body.ex{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#vw{position:fixed;inset:0;z-index:120;background:#000b;display:none;align-items:center;justify-content:center;padding:16px}
.vb{background:#fff;border-radius:18px;padding:28px;max-width:420px;text-align:center;animation:up .25s}.vb h2{color:#c0392b;margin:6px 0}
.vc{background:#ffffff30;border-radius:20px;padding:4px 11px;font-size:13px;font-weight:700}
/* kartu ujian & cetak */
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
.kt{border:2px solid var(--g);border-radius:10px;padding:10px 12px;break-inside:avoid;position:relative;overflow:hidden;font-size:12px}
.kt .h{display:flex;gap:8px;align-items:center;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:6px;position:relative}.kt .h img{width:42px;height:42px;object-fit:contain}
.kt .h b{color:var(--g);font-size:11.5px;display:block;line-height:1.2}.kt h4{margin:4px 0;text-align:center;letter-spacing:1px;color:var(--gd);font-size:14px;position:relative}
.kt table{font-size:12px;position:relative}.kt td{padding:3px 4px;border:0}.kt td:first-child{width:70px;color:#555}
.pwd{font-family:monospace;font-weight:700;background:#f1f1f1;padding:1px 6px;border-radius:4px}.kt small{display:block;margin-top:6px;color:#666;font-size:10px;position:relative}
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;flex:none;background:var(--gl);border:3px solid #fff;box-shadow:0 2px 10px #0002;vertical-align:middle}
.av.ph{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;font-weight:800}
.hi{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border-radius:18px;padding:20px 24px;margin-bottom:18px;position:relative;overflow:hidden}
.hi:after{content:"";position:absolute;right:-30px;top:-40px;width:170px;height:170px;border-radius:50%;background:#ffffff18}.hi h2{margin:0 0 4px}.hi p{margin:0;opacity:.92}
.hero{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}@media(max-width:760px){.hero{grid-template-columns:1fr}}
.prof{text-align:center}.prof h3{margin:12px 0 6px}
.ro{text-align:left;margin-top:14px}.ro div{background:#f6f9f7;border-radius:10px;padding:9px 12px;margin:8px 0}.ro small{display:block;color:var(--mu);font-size:11.5px}.ro b{font-size:15px}
.lock{font-size:12.5px;color:#7a5d00;background:#fff8e1;border-radius:10px;padding:8px 10px;margin:12px 0 0;text-align:left}
.rl{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--bd)}.rl:last-child{border:0}
.rl i{font-style:normal;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--gl);flex:none}
.srch{max-width:340px}.tdp{display:flex;align-items:center;gap:10px}
.kb{display:flex;gap:10px;align-items:flex-start;position:relative}.kb table{flex:1}
.kf{width:2.4cm;height:3.2cm;border:1.5px solid var(--g);border-radius:6px;overflow:hidden;display:grid;place-items:center;color:#999;font-size:10px;text-align:center;flex:none;background:#fff}.kf img{width:100%;height:100%;object-fit:cover}
#fg{position:fixed;inset:0;z-index:130;background:linear-gradient(#fff 55%,#e9f6ee);display:none;align-items:center;justify-content:center;padding:20px;text-align:center}
#fg.on{display:flex}.gb{max-width:380px;animation:up .3s}.gb img{width:110px;height:110px;object-fit:contain}.gb h2{color:var(--g);margin:10px 0 6px}.gb p{color:var(--mu);margin:0 0 18px}
.ni{display:inline-flex;align-items:center;gap:6px;background:#ffffff26;color:#fff;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;user-select:none}
.ni .tx2{opacity:.85;font-weight:600}.bars{display:inline-flex;align-items:flex-end;gap:2px;height:14px}.bars i{width:3px;border-radius:1px;background:#fff;display:block}
.bars.mid i{background:#ffd54f}.bars.bad i{background:#ffab91}.bars.off i{background:#ff8a80}
.lgni{position:absolute;top:14px;right:14px;z-index:3}.nr{display:flex;gap:8px;align-items:center}
@media(max-width:520px){.ni .tx2{display:none}.ni{padding:4px 8px}}
#pr{display:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}}

/* ===== Indikator jaringan (sinyal + kecepatan + ping) ===== */
const NET = { ms: null, mbps: null, busy: false, fail: 0 }, PING_BYTES = 60000;
function barCount() {
  if (!navigator.onLine) return 0;
  if (NET.ms == null) { const c = navigator.connection; return c ? ({ 'slow-2g': 1, '2g': 1, '3g': 2, '4g': 4 }[c.effectiveType] || 3) : 3; }
  return NET.ms < 600 ? 4 : NET.ms < 1200 ? 3 : NET.ms < 2500 ? 2 : 1;
}
function netInner() {
  const n = barCount(), off = !navigator.onLine, cls = off ? 'off' : n <= 1 ? 'bad' : n === 2 ? 'mid' : 'ok';
  const c = navigator.connection, mb = NET.mbps != null ? NET.mbps : (c && c.downlink != null ? c.downlink : null);
  const sp = off ? 'Offline' : NET.busy ? 'Mengukur…' : (mb != null ? '↓ ' + (NET.mbps != null ? '≈ ' : '') + (mb >= 10 ? Math.round(mb) : mb.toFixed(1)) + ' Mbps' : '—');
  return `<span class="bars ${cls}">${[4, 7, 10, 13].map((h, i) => `<i style="height:${h}px;opacity:${i < n ? 1 : .3}"></i>`).join('')}</span><span>${sp}</span>${!off && !NET.busy && NET.ms != null ? `<span class="tx2">· ${NET.ms} ms</span>` : ''}`;
}
const updateNet = () => document.querySelectorAll('.ni').forEach(e => e.innerHTML = netInner());
async function ukurJaringan(full) {
  if (NET.busy || !navigator.onLine) { updateNet(); return; }
  NET.busy = !!full; updateNet();
  try {
    const t0 = performance.now(); await call('ping', 0); const rtt = Math.round(performance.now() - t0); NET.ms = rtt;
    if (full) { const t1 = performance.now(); await call('ping', PING_BYTES); const d = Math.max(performance.now() - t1 - rtt, 50); NET.mbps = Math.min(+(PING_BYTES * 8 / 1e6 / (d / 1000)).toFixed(2), 999); }
    NET.fail = 0;
  } catch (e) { NET.fail++; }
  NET.busy = false; updateNet();
}
if (navigator.connection) navigator.connection.addEventListener('change', updateNet);

/* ===== Jaringan: deteksi, timeout, retry ===== */
const slow = () => { const c = navigator.connection; return !!c && (c.saveData || /2g|3g/.test(c.effectiveType || '')); };
let nbT;
function netUI(flashOk) {
  const b = $('nb'); clearTimeout(nbT);
  if (!navigator.onLine) { b.className = 'show off'; b.textContent = '📡 Offline — jawaban tetap tersimpan di perangkat'; }
  else if (slow()) { b.className = 'show slow'; b.textContent = '🐢 Koneksi lambat — mode hemat aktif'; }
  else if (flashOk) { b.className = 'show ok'; b.textContent = '✅ Tersambung kembali'; nbT = setTimeout(() => b.className = '', 2500); }
  else b.className = '';
}
addEventListener('online', () => { netUI(true); updateNet(); NET.fail = 0; ukurJaringan(true); flushPending(); }); addEventListener('offline', () => { netUI(); updateNet(); });
if (navigator.connection) navigator.connection.addEventListener('change', () => netUI());
const once = (f, a) => new Promise((ok, no) => {
  let d = 0; const t = setTimeout(() => { if (!d) { d = 1; no(new Error('Waktu habis, koneksi lambat')) } }, 30000);
  google.script.run.withSuccessHandler(r => { if (!d) { d = 1; clearTimeout(t); ok(r) } }).withFailureHandler(e => { if (!d) { d = 1; clearTimeout(t); no(e) } })[f](...a);
});
const RETRY = ['login', 'daftarMapel', 'dataAdmin', 'kirimJawaban'];
async function call(f, ...a) {
  const n = RETRY.includes(f) ? 4 : 1; let err;
  for (let i = 0; i < n; i++) { try { return await once(f, a); } catch (e) { err = e; if (i < n - 1) await sleep(1200 * 2 ** i); } }
  throw err;
}

}
